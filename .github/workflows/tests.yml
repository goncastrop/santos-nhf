name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Misma versión exacta que los paquetes serverpod* de los pubspecs.
      VERSION: '4.0.3'
      # `config/passwords.yaml` no está en el repo, así que en CI las claves
      # vienen por entorno. Son de test y no protegen nada: la base embebida se
      # crea de cero en cada corrida y los peppers no firman nada que sobreviva.
      SERVERPOD_PASSWORD_database: 'CdHY12yuHqk5og4hwFtZnekISP3zoHmq'
      SERVERPOD_PASSWORD_redis: 'NXJ5QIQhC7Ww5KBUkLi4Hk68BQxBSNzc'
      SERVERPOD_PASSWORD_emailSecretHashPepper: 'pepper-de-test-no-es-un-secreto'
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'pepper-de-test-no-es-un-secreto'
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 'clave-de-firma-de-test-no-es-un-secreto'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'

      - name: Install dependencies
        run: flutter pub get

      # `dart install` deja el ejecutable en un directorio que no está en el PATH
      # del runner y que su propio help no documenta. `pub global activate` lo
      # instala y `pub global run` lo invoca por paquete, sin depender del PATH.
      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli "$VERSION"

      - name: Run Serverpod generator
        working-directory: saints_nhf_server
        run: dart pub global run serverpod_cli:serverpod_cli generate

      # Sin Docker a propósito: `config/test.yaml` define `dataPath`, así que
      # Serverpod arranca y administra su propio PostgreSQL embebido. Levantar
      # además el `postgres_test` del docker-compose le robaba el puerto 9090 y
      # los tests no podían abrir su base.
      #
      # `-r expanded` porque el reporte por defecto lista los tests que fallan
      # pero se come el mensaje, que es justo lo que hace falta para diagnosticar.
      - name: Run tests
        working-directory: saints_nhf_server
        run: dart test -r expanded

      # El PostgreSQL embebido escribe acá por qué no pudo arrancar. Sin esto, un
      # fallo de la base se ve como "todos los tests de integración fallaron" y
      # nada más.
      - name: Database log on failure
        if: failure()
        working-directory: saints_nhf_server
        run: |
          for f in .serverpod/test/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            tail -80 "$f"
          done
          echo "===== versiones ====="
          dart --version
          uname -a
