name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0'
      SERVERPOD_PASSWORD_database: 'CdHY12yuHqk5og4hwFtZnekISP3zoHmq'
      SERVERPOD_PASSWORD_redis: 'NXJ5QIQhC7Ww5KBUkLi4Hk68BQxBSNzc'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Start containers
        working-directory: saints_nhf_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart install serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: saints_nhf_server
        run: serverpod generate

      - name: Run tests
        working-directory: saints_nhf_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: saints_nhf_server
        run: docker compose down -v
