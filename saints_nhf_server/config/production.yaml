# Configuración de producción: un Cloud Server de DonWeb con Docker Compose
# (ver `deploy/`). Caddy termina TLS y hace reverse proxy hacia estos puertos,
# así que el servidor habla HTTP plano dentro de la red de Docker.
#
# Nada de esto es secreto. Las contraseñas van por variables de entorno:
# SERVERPOD_DATABASE_PASSWORD, SERVERPOD_SERVICE_SECRET y
# SERVERPOD_PASSWORD_<clave> para las propias de la app.

# API que consume la app Flutter.
apiServer:
  port: 8080
  publicHost: api.santos.nhf.com.ar
  publicPort: 443
  publicScheme: https

# Insights no se publica: Caddy no lo expone y el puerto no sale del host.
# Para usarlo, túnel SSH: ssh -L 8081:localhost:8081 <host>
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# Servidor web: sirve la app Flutter compilada y el callback de OAuth.
webServer:
  port: 8082
  publicHost: santos.nhf.com.ar
  publicPort: 443
  publicScheme: https

# Postgres corre en el mismo Compose. El tráfico no sale de la red interna de
# Docker, y el puerto no se publica al host, así que no se pide SSL.
database:
  host: postgres
  port: 5432
  name: saints_nhf
  user: serverpod
  requireSsl: false

redis:
  enabled: false
  host: redis
  port: 6379

maxRequestSize: 10485760 # 10 MB, so saint illustrations can be uploaded

# The live trivia opens and closes its questions with future calls, and a
# 20-second question cannot wait the default 5 seconds for the next scan.
futureCall:
  concurrencyLimit: 2
  scanInterval: 1000 # milliseconds

# Los logs van a stdout del contenedor (`docker compose logs`), con rotación
# configurada en el daemon de Docker por `deploy/provision.sh`. Los logs
# persistentes quedan apagados para no llenar el disco del servidor; si se
# quieren ver las sesiones en Insights, poner `persistentEnabled: true` y
# configurar una retención.
sessionLogs:
  consoleEnabled: true
  consoleLogFormat: json
  persistentEnabled: false
