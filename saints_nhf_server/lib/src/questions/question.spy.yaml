### A multiple-choice question about a saint. Only admins see [correctIndex].
class: Question
table: question
fields:
  saintId: int, relation(parent=saint, onDelete=Cascade)
  prompt: String
  ### Exactly four options.
  options: List<String>
  correctIndex: int
  kind: QuestionKind, default=manual
  ### For the generated ones, the saint behind each option, in the order of
  ### [options]. Null for the ones an admin typed.
  optionSaintIds: List<int>?
  createdAt: DateTime, default=now
indexes:
  question_saint_idx:
    fields: saintId
