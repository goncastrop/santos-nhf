services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: saints_nhf
      POSTGRES_PASSWORD: "wmX9mRhk-m48Z2TIMUvgO2-1FswborOS"
    volumes:
      - saints_nhf_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "lCvp4qdGjrlSweDQJ5hIyK6_0PnJ4tb1"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: saints_nhf_test
      POSTGRES_PASSWORD: "CdHY12yuHqk5og4hwFtZnekISP3zoHmq"
    volumes:
      - saints_nhf_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "NXJ5QIQhC7Ww5KBUkLi4Hk68BQxBSNzc"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  saints_nhf_data:
  saints_nhf_test_data:
